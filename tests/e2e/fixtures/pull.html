<!doctype html>
<html lang="en" data-color-mode="auto" data-light-theme="light" data-dark-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Fix typo by octocat · Pull Request #1 · octo-org/hello-world · GitHub</title>
    <!-- 仿拉取请求对话页评论中的建议块（忽略区域内的重新进入区域）的离线夹具 -->
    <link rel="stylesheet" href="/__fixtures__/github-sim.css" />
  </head>
  <body class="logged-in env-production page-responsive">
    <div class="comment-body markdown-body js-comment-body" data-fx="comment-body">
      <p data-fx="comment-user">Pull requests</p>
      <div class="my-2 border rounded-2 js-suggested-changes-blob diff-view">
        <div class="d-flex flex-items-center px-2 py-1 border-bottom">
          <span class="text-small" data-fx="suggested-label">Suggested change</span>
        </div>
        <div class="blob-wrapper data file">
          <table class="d-table tab-size mb-0 width-full">
            <tbody>
              <tr class="border-0">
                <td class="blob-num blob-num-deletion text-right border-0 px-2 py-1" data-line-number="1"></td>
                <td class="border-0 px-2 py-1 blob-code-inner blob-code-deletion js-blob-code-deletion">Issues</td>
              </tr>
              <tr class="border-0">
                <td class="blob-num blob-num-addition text-right border-0 px-2 py-1" data-line-number="1"></td>
                <td
                  class="border-0 px-2 py-1 blob-code-inner blob-code-addition js-blob-code-addition"
                  data-fx="suggested-code"
                >
                  Pull requests
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="js-apply-changes" data-fx="apply"></div>
      </div>
    </div>
    <script>
      // 模拟 React 门户：稍后向按钮区插入按钮
      setTimeout(() => {
        document.querySelector('[data-fx="apply"]').innerHTML =
          '<button type="button" class="btn" data-fx="apply-button">Commit suggestion</button>'
        document.body.dataset.fxPortal = 'true'
      }, 300)
    </script>
  </body>
</html>
